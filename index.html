    <script>
      // Suppress benign Vite HMR websocket disconnect warnings in sandboxed preview iframe
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('vite') || e.message.includes('closed without opened'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e.reason && (e.reason.message || e.reason));
        if (str.includes('WebSocket') || str.includes('vite') || str.includes('closed without opened')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
